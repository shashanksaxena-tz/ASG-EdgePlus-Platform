name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Baseline. This is the gate: bytecode target 21, built on Corretto 21, must be green to merge.
  verify:
    name: Build & Test (Corretto 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Amazon Corretto 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: corretto
          cache: maven
      - name: Verify
        # -Ddocker.available=false: nothing here needs a container.
        run: mvn -B -ntp verify -Ddocker.available=false

  # Forward compatibility. Same sources, same bytecode target (21), built and tested on
  # Corretto 24 so that a JDK bump is a decision rather than a discovery. The jdk24-runtime
  # profile in the parent POM activates automatically here and supplies the agent/Byte Buddy
  # flags a modern JDK needs.
  #
  # Advisory while the toolchain versions settle (JaCoCo 0.8.13 / PIT 1.19.1 are the first
  # releases that accept a 24 JVM at all). Flip continue-on-error to false once it has been
  # green for a full release cycle, and delete this comment with it.
  forward-compat:
    name: Forward-compat (Corretto ${{ matrix.java }}, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        java: ['24']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Amazon Corretto ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: corretto
          cache: maven
      - name: Verify on JDK ${{ matrix.java }} (target stays 21)
        run: mvn -B -ntp verify -Ddocker.available=false
      - name: Verify targeting JDK ${{ matrix.java }} (-Pjava24)
        # Second pass: what would break if a service actually moved its target forward.
        run: mvn -B -ntp verify -Ddocker.available=false -Pjava24
