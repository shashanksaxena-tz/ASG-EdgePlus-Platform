name: Release

# A tag vX.Y.Z publishes that release. A push to main publishes the current
# X.Y.Z-SNAPSHOT, so services pinned to the snapshot resolve in CI between releases.
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Amazon Corretto 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: corretto
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./mvnw -B -ntp versions:set -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false
      - name: Publish
        # No <distributionManagement> in the poms: asg-edgeplus-parent is every service's parent,
        # and a deploy target there would be inherited by the services too.
        run: >-
          ./mvnw -B -ntp deploy -Ddocker.available=false
          -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
