# Maven Wrapper: pins the Maven VERSION so ./mvnw builds identically on a laptop, in CI and in a
# Docker build, with no local Maven install. distributionType=only-script means there is no
# maven-wrapper.jar in the repo -- the script fetches the distribution itself. That is what the
# other ASG services use, so this stays consistent with them.
#
# 3.9.16 is the newest version in the estate today (Api-Gateway). User-Service, Documents-Service
# and Audit-Service are still on 3.9.14; they should be brought here, but that is their own PR.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
